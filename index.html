<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="player">
        <img src="images/cover1.jpeg" class="cover" alt="Cover">
        <h2 id="title">Song Title</h2>
        <p id="artist">Artist Name</p>

        <audio id="audio"></audio>

        <div class="controls">
            <!--<button id="star"><img src="images/star.png" alt="star"></button> -->
            <button id="loop"><img src="images/loop.png" alt="loop"></button>
            <button id="prev"><img src="images/prevBtn.png" alt="prev"></button>
            <button id="play"><img src="images/playBtn.png" alt="play"></button>
            <button id="next"><img src="images/nextBtn.png" alt="next"></button>
            <button id="shuffle"><img src="images/shuffleBtn.png" alt="shuffle"></button>
        </div>

        <div class="progress-container">
            <div class="progress">
                <input type="range" id="progress" value="0">
            </div>
            <div class="time">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
        <div class="volume">
            <img class="vol-icon" src="images/volume-icon1.png" alt="🎶">
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
